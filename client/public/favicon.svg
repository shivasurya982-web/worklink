<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="worklynGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF7A18"/>
      <stop offset="55%" stop-color="#EA580C"/>
      <stop offset="100%" stop-color="#C2410C"/>
    </linearGradient>

    <!-- Metallic/Clean White Gradient -->
    <linearGradient id="whiteGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F1F5F9"/>
    </linearGradient>

    <!-- Deep Drop Shadow -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#7C2D12" flood-opacity="0.45"/>
    </filter>

    <!-- Golden AI Star Glow -->
    <filter id="starGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Modern Rounded Squircle Base (Signature Brand Orange) -->
  <rect width="512" height="512" rx="118" fill="url(#worklynGradient)"/>
  
  <!-- Subtle High-Gloss Inner Border -->
  <rect x="8" y="8" width="496" height="496" rx="110" fill="none" stroke="rgba(255,255,255,0.28)" stroke-width="12"/>

  <!-- Main Symbol Group with Soft Drop Shadow -->
  <g filter="url(#shadow)">
    <!-- Main 'W' Structure -->
    <path d="M 104 205 L 180 376 C 185 388 200 393 210 384 L 256 342 L 302 384 C 312 393 327 388 332 376 L 402 218" 
          fill="none" 
          stroke="url(#whiteGrad)" 
          stroke-width="48" 
          stroke-linecap="round" 
          stroke-linejoin="round"/>

    <!-- Left Hardhat Silhouette (Integrated Service Professional) -->
    <g transform="translate(136, 134)">
      <!-- Hardhat Dome -->
      <path d="M 10 38 C 10 10 60 10 60 38 Z" fill="#FFFFFF"/>
      <!-- Hardhat Ridge Center Reflection -->
      <path d="M 33 13 L 37 13 L 37 38 L 33 38 Z" fill="rgba(234, 88, 12, 0.25)"/>
      <!-- Hardhat Brim -->
      <path d="M 2 39 C 20 34 50 34 68 39 C 68 44 2 44 2 39 Z" fill="#FFFFFF"/>
      <!-- Head / Face Silhouette -->
      <path d="M 18 44 Q 35 54 52 44 Q 52 62 35 62 Q 18 62 18 44 Z" fill="#FFFFFF"/>
    </g>

    <!-- Right Wrench Tool Silhouette (Master Craftsmanship) -->
    <g transform="translate(396, 168) rotate(34)">
      <!-- Wrench Jaw Base -->
      <path d="M -22 -10 L -6 -10 C -4 -18 8 -22 18 -20 C 28 -18 32 -10 32 -4 C 20 -2 20 12 32 14 C 32 20 28 28 18 30 C 8 32 -4 28 -6 20 L -22 20 Z" fill="#FFFFFF"/>
    </g>

    <!-- Central Precision Nexus / Verified Badge Dot -->
    <circle cx="256" cy="342" r="15" fill="#EA580C" stroke="#FFFFFF" stroke-width="7"/>
  </g>

  <!-- Glowing Golden AI Sparkle Star (Top Right) -->
  <g transform="translate(416, 96)" filter="url(#starGlow)">
    <path d="M 0 -28 Q 3 -7 24 0 Q 3 7 0 28 Q -3 7 -24 0 Q -3 -7 0 -28 Z" fill="#FEF08A"/>
    <circle cx="0" cy="0" r="5" fill="#FFFFFF"/>
  </g>
</svg>
